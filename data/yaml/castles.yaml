# 城堡靜態地理資料（Java L1CastleLocation.java 對照）
# war_area: 攻城戰範圍
# tower: 守護塔位置
# inner_map: 內城地圖 ID（0=無）
# getback_town: 攻城戰開始時非城盟玩家傳送到的城鎮 town_id
